<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; background-image: linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)); }
        .modal-content { border-radius: 8px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .btn-submit { background-color: #0d6efd; color: white; font-weight: 500; }
        .btn-submit:hover { background-color: #0b5ed7; color: white; }
        .login-header { font-weight: 700; font-size: 1.5rem; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="container mt-5 opacity-50">
        <h2 class="mb-4">Browse Current Deals</h2>
        <div class="card p-4"><p>Please log in to view auction details.</p></div>
    </div>

    <div class="modal fade show" id="loginModal" tabindex="-1" style="display: block; background-color: rgba(0,0,0,0.5);" aria-modal="true" role="dialog">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body p-5">
                    <div class="login-header text-start text-secondary">Login</div>
                    
                    <!-- Error Message Container -->
                    <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>

                    <!-- Changed form action to javascript function -->
                    <form onsubmit="handleLogin(event)">
                        <div class="row mb-3 align-items-center">
                            <label class="col-sm-3 col-form-label text-secondary">User Name :</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="username" placeholder="Enter User name" required>
                            </div>
                        </div>
                        <div class="row mb-4 align-items-center">
                            <label class="col-sm-3 col-form-label text-secondary">Password :</label>
                            <div class="col-sm-9">
                                <input type="password" class="form-control" id="password" placeholder="Password" required>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <a href="#" class="text-decoration-none text-primary" style="font-size: 0.9rem;">Register? Create a new Account</a>
                        </div>

                        <div class="d-flex justify-content-end border-top pt-3">
                            <button type="submit" class="btn btn-submit me-2">
                                <i class="bi bi-box-arrow-in-right"></i> Submit
                            </button>
                            <button type="button" class="btn btn-light border" onclick="window.location.reload()">
                                <i class="bi bi-x-lg"></i> Close
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

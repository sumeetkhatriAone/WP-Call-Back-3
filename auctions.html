<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Auctions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; }
        .modal-content { border-radius: 10px; border: none; box-shadow: 0 15px 40px rgba(0,0,0,0.3); }
        .auction-header { font-weight: 900; font-size: 1.4rem; color: #333; margin-bottom: 1.5rem; line-height: 1.4; }
        
        /* Container for the list of auctions */
        .auction-list-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            background-color: #ffffff;
        }
        
        /* Each individual auction row */
        .auction-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            background-color: #fafafa;
            transition: background-color 0.2s;
        }
        .auction-row:hover {
            background-color: #f1f3f5;
        }

        /* Styling for Auction ID and Name */
        .auction-details {
            flex: 1;
            font-size: 0.95rem;
            margin-right: 15px;
        }
        .auction-id-box {
            font-weight: bold;
            color: #0d6efd;
            border: 1px solid #0d6efd;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: #e6f0ff;
            margin-right: 10px;
            display: inline-block;
        }
        .company-name-box {
            font-weight: 500;
            color: #333;
            border: 1px solid #ced4da;
            padding: 4px 8px;
            border-radius: 4px;
            background-color: #fff;
            display: inline-block;
        }

        /* Styling for the radio button options */
        .status-options {
            display: flex;
            gap: 15px;
            min-width: 350px;
            justify-content: flex-end;
        }
        .status-options .form-check {
            margin: 0;
            padding-left: 1.8em;
        }
        .status-options .form-check-label {
            font-size: 0.9rem;
            cursor: pointer;
            color: #555;
        }
        .status-options .form-check-input {
            cursor: pointer;
        }

        /* Success Message */
        .success-container { text-align: center; padding: 40px 20px; }
        .success-icon { font-size: 4rem; color: #198754; margin-bottom: 20px; }
        .success-text { font-size: 1.2rem; font-weight: 500; color: #333; margin-bottom: 10px; }

        /* Center submit button */
        .submit-btn-container {
            display: flex;
            justify-content: center;
            border-top: 1px solid #dee2e6;
            padding-top: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand mb-0 h1">Auction Portal</span>
        <div class="d-flex text-white align-items-center">
            <span class="me-3">Welcome, User</span>
            <a href="index.html" class="btn btn-outline-light btn-sm" onclick="sessionStorage.clear()">Logout</a>
        </div>
    </nav>

    <div class="modal fade show" id="auctionModal" tabindex="-1" style="display: block; background-color: rgba(0,0,0,0.6);" aria-modal="true" role="dialog">
        <div class="modal-dialog modal-xl modal-dialog-centered"> <!-- Changed to modal-xl for more width -->
            <div class="modal-content">
                <div class="modal-body p-5">
                    
                    <!-- Form View -->
                    <div id="formView">
                        <div class="auction-header text-center">
                            Please select the auction you are interested in:
                        </div>

                        <div id="selectionError" class="alert alert-warning d-none" role="alert">
                            Please provide a status for all auctions before submitting.
                        </div>

                        <form onsubmit="handleAuctionSubmit(event)">
                            <div class="auction-list-container mb-4" id="auctionList">
                                <!-- JavaScript will populate this list -->
                            </div>

                            <!-- Centered Submit Button -->
                            <div class="submit-btn-container">
                                <button type="submit" class="btn btn-primary px-5 py-2 fs-5">
                                    <i class="bi bi-check-circle me-2"></i> Submit
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Success View -->
                    <div id="successView" class="success-container d-none">
                        <i class="bi bi-check-circle-fill success-icon"></i>
                        <div class="success-text">Your responses have been submitted.</div>
                        <div class="text-muted">We will connect with you shortly.</div>
                        
                        <div class="mt-5 border-top pt-4">
                            <a href="index.html" class="btn btn-primary px-4 py-2" onclick="sessionStorage.clear()">Close & Logout</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
